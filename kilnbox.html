			<p class="story-text" data-i18n="kilnbox.story1">北宋·禹州钧台 —— 你是替宫廷烧瓷的窑工。钧瓷之美，尽在窑变：釉料入窑时只是一色天蓝，开窑那一刻，铜红釉料在高温还原焰中幻化出万紫千红。连徽宗也忍不住下令："雨过天青釉可仿，窑变天成不可求。"</p>
